
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impromptu by K^3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="container">
    <h1 id="title">Impromptu Topics Generator</h1>

    <button id="btn">Click for a New Topic</button>
    <div id="output" aria-live="polite">
      Click the button to generate a new topic!
    </div>

    <div class="for-time">
      <h2>Countdown: <span id="time-left">00</span></h2>
      <h2>
        Timer: <span id="seconds">00</span> :
        <span id="tens">00</span>
      </h2>
    </div>

    <div class="timer-buttons">
      <button id="button-start">Start</button>
      <button id="button-stop">Pause</button>
      <button id="button-reset">Reset</button>
    </div>
  </main>

  <script src="topics.js"></script>
  <script src="main.js"></script>
</body>
</html>
